[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disputes"
version = "0.1.0"
description = "Payment dispute and consumer complaint workflow: four models, a deterministic regulatory rules engine, cited draft responses"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scikit-learn>=1.3", "langgraph>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.5", "httpx>=0.27"]
serving = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6"]
llm = ["anthropic>=0.40"]
# The QLoRA fine-tune. Needs a GPU; nothing in the default install or in CI
# imports any of this.
finetune = ["torch>=2.2", "transformers>=4.44", "peft>=0.12", "bitsandbytes>=0.43", "trl>=0.11", "datasets>=2.20"]
tracking = ["mlflow>=2.12", "evidently>=0.4"]

[project.scripts]
disputes = "disputes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
